name: Validate and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills and build packages
        run: python scripts/build_release.py

      - name: Verify release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax1-bizplan-${{ github.sha }}
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/skills/*.zip dist/SHA256SUMS.txt --generate-notes
