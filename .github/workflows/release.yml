name: Validate and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install presentation validation dependencies
        run: python -m pip install "Pillow==12.3.0" "python-pptx==1.0.2"

      - name: Validate contributor PR policy
        if: github.event_name == 'pull_request'
        shell: bash
        run: python scripts/validate_pr.py --base "${{ github.event.pull_request.base.sha }}"

      - name: Validate skills and build packages
        run: python scripts/build_release.py

      - name: Verify release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax1-bizplan-validation-${{ github.sha }}
          path: dist/
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: ax1-bizplan-validation-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/SHA256SUMS.txt
          --verify-tag
          --title "AX1 Skill Pack $GITHUB_REF_NAME"
          --notes-file dist/RELEASE_NOTES.md
