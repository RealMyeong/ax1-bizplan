name: Validate and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills and build packages
        run: python scripts/build_release.py

      - name: Verify release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax1-bizplan-${{ github.sha }}
          path: dist/

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: ax1-bizplan-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/skills/*.zip dist/SHA256SUMS.txt
          --verify-tag
          --title "AX1 Bizplan $GITHUB_REF_NAME"
          --notes-file dist/RELEASE_NOTES.md

      - name: Refresh notes for the current published version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$(tr -d '\r\n' < VERSION)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file dist/RELEASE_NOTES.md
          else
            echo "::notice::Release $tag does not exist; notes refresh skipped."
          fi
