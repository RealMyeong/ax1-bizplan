interface:
  display_name: "R&D 사업계획서 초안"
  short_description: "사업 구체화 후 DOCX 초안 또는 HWPX 반영용 확정 문안 작성"
  default_prompt: "$bizplan-draft를 사용해 현재 폴더의 RFP와 양식을 확인해줘. 사업 아이디어와 구현 방식에 핵심 공백이 있으면 실행대안과 질문으로 먼저 구체화한 뒤, 답변을 실현 가능한 과업·연차·KPI·실증·사업화 구조로 다듬어 계획서 초안을 작성해줘. 실제 문서 파일은 별도 지정이 없으면 DOCX로 만들고 전 페이지를 시각 검증해줘. HWPX 양식이 지정되면 내용을 확정한 뒤 $bizplan-hwpx로 안전하게 반영해줘."
policy:
  allow_implicit_invocation: true
